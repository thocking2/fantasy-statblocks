name: Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:

env:
    PLUGIN_NAME: fantasy-statblocks

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run validate-manifest
            - run: npm run build
            - name: Package plugin zip
              run: |
                  mkdir "$PLUGIN_NAME"
                  cp main.js manifest.json styles.css "$PLUGIN_NAME"
                  zip -r "$PLUGIN_NAME.zip" "$PLUGIN_NAME"
            - name: Create or update release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  assets="main.js manifest.json styles.css $PLUGIN_NAME.zip"
                  if gh release view "$tag" >/dev/null 2>&1; then
                      gh release upload "$tag" $assets --clobber
                  else
                      gh release create "$tag" --title "$tag" --generate-notes $assets
                  fi
