name: Tag release

# After CI passes on main, tag the commit with the version currently in
# manifest.json (if that version isn't already tagged), then hand off to
# the release workflow directly. We call it via workflow_call rather than
# relying on the tag push to retrigger it, since tags pushed with the
# default GITHUB_TOKEN don't fire other workflows.
on:
    workflow_run:
        workflows: ["CI"]
        branches: [main]
        types: [completed]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    tag:
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.check.outputs.version }}
            created: ${{ steps.check.outputs.created }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.ref }}
                  fetch-depth: 0
            - name: Determine version and tag status
              id: check
              run: |
                  VERSION=$(node -p "require('./manifest.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
                      echo "created=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "created=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Create and push tag
              if: steps.check.outputs.created == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "${{ steps.check.outputs.version }}" -m "Release ${{ steps.check.outputs.version }}"
                  git push origin "${{ steps.check.outputs.version }}"

    release:
        needs: tag
        if: needs.tag.outputs.created == 'true'
        uses: ./.github/workflows/release.yml
        secrets: inherit
        with:
            tag: ${{ needs.tag.outputs.version }}
